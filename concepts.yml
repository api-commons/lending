context: lending
name: Lending
intro: >-
  The common lending vocabulary -- loan applications, the offers made against them, the
  loans and credit lines that result, the borrowers who hold them and the repayments that
  settle them -- distilled from the APIs that already exist.
tags: [Lending, Mortgage, Credit, Buy Now Pay Later, BNPL, Consumer Lending, Loan Origination, Loans, Embedded Lending]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url]

common_fields:
  id: [uuid, guid, object_id, record_id, remote_id, loan_id, application_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, loan_status, application_status, decision, stage]
  amount: [principal, loan_amount, requested_amount, principal_amount, amount_requested, approved_amount, value]
  currency: [currency_code, iso_currency_code]
  borrower_id: [borrower, customer_id, customer, applicant_id, applicant, member_id, person_id, client_id, consumer_id]
  interest_rate: [rate, apr, annual_percentage_rate, interest, nominal_rate, interest_rate_percentage]
  term: [term_months, term_length, duration, loan_term, number_of_payments, tenor, installments_count]

concepts:
  loan:
    segments: [loans, loan, credit_lines, credit-lines, lines_of_credit, credit_facilities, facilities, mortgages, plans@bnpl|installments, installment_plans, financing]
    aliases:
      balance: [outstanding_balance, principal_balance, current_balance, remaining_balance, outstanding_principal, balance_due]
      originated_at: [origination_date, disbursed_at, disbursement_date, funded_at, start_date, opened_at]
      maturity_date: [maturity, end_date, payoff_date, matures_at]
      next_payment_date: [next_due_date, next_payment_due_date, due_date]
      product_id: [product, loan_product_id, loan_type, product_type, type]
  # loan_application, offer and repayment were measured and dropped: 4, 1 and 2 providers
  # expose them (3, 1 and 1 with a readable schema).
  borrower:
    requires: [loan]
    segments: [borrowers, borrower, applicants, applicant]
    aliases:
      first_name: [firstname, given_name]
      last_name: [lastname, surname, family_name]
      email: [email_address, emails]
      phone: [phone_number, mobile]
      date_of_birth: [dob, birth_date]
      ssn: [tax_id, national_id, social_security_number, ssn_last4]
      income: [annual_income, monthly_income, gross_income]

duplicates:
  figure: [figure-technology-solutions]
  oper: [oper-credits]
  orbii: [orbii-tech-ltd]

findings:
  - "Lending publishes less than any context so far: 134 lending, mortgage, credit and BNPL
    providers in the cohort, 14 exposing loans. Origination, decisioning and servicing APIs
    are overwhelmingly private or partner-gated."
  - "What is public agrees only on a loan's id and amount. Balance, rate, term and maturity
    are each modelled by too few providers to call shared."
decisions:
  - "Applications, offers and repayments are not published as concepts: measured, 3, 1 and 1
    providers expose them with a readable schema. They are recorded here so the next
    re-measure can add them when the market publishes."
  - "A borrower is `borrowers` or `applicants` only. `customers` and `members` brought in
    payment customers and workspace members from the wider fintech cohort."
  - "Credit lines, BNPL installment plans and mortgages are loans: each is a principal lent
    against a schedule."
  - "Duplicates merged: Figure, Oper, Orbii."
